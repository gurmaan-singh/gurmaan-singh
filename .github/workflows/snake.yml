name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Platane/snk v3.3.0, pinned to its commit
      - uses: Platane/snk/svg-only@a69d1dbca7a94c2ef0edf10dcd9e19982d74dd39
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#E0122B
      - name: Publish to the output branch
        run: |
          mkdir -p /tmp/out && cp dist/*.svg /tmp/out/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf . -q
          cp /tmp/out/*.svg .
          git add ./*.svg
          git commit -q -m "Update contribution snake"
          git push -f origin output
