<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="img" aria-label="What I work on">
  <rect width="900" height="44" fill="#000"/>
  <text x="0" y="28" fill="#fff" font-family="Consolas, 'Courier New', monospace" font-size="20" opacity="0"><tspan fill="#E0122B">&gt; </tspan>Multi-target tracking: IMM and Kalman filters<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.23;0.25;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="0" y="28" fill="#fff" font-family="Consolas, 'Courier New', monospace" font-size="20" opacity="0"><tspan fill="#E0122B">&gt; </tspan>Real-time C++20: lock-free queues, low latency<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.5;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="0" y="28" fill="#fff" font-family="Consolas, 'Courier New', monospace" font-size="20" opacity="0"><tspan fill="#E0122B">&gt; </tspan>Sensor data: ASTERIX, UDP, ADS-B<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.73;0.75;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="0" y="28" fill="#fff" font-family="Consolas, 'Courier New', monospace" font-size="20" opacity="0"><tspan fill="#E0122B">&gt; </tspan>Testing: seeded Monte Carlo, GOSPA, unit tests<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.98;1.0" dur="12s" repeatCount="indefinite"/></text>
</svg>
