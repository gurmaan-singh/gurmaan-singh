<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Timeline: mentoring, Mechatronics degree, pick-and-place robot, PLC mixer tank, underwater drone, vakt">
