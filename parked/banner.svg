<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Gurmaan Singh, mechatronics engineering student">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0122B" stop-opacity="0"/>
      <stop offset="1" stop-color="#E0122B" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="1000" cy="150" r="118"/></clipPath>
  </defs>
  <rect width="1200" height="300" fill="#000"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 50H1200M0 100H1200M0 150H1200M0 200H1200M0 250H1200"/>
    <path d="M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/>
  </g>
  <!-- radar -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22">
    <circle cx="1000" cy="150" r="118"/><circle cx="1000" cy="150" r="79"/><circle cx="1000" cy="150" r="40"/>
    <path d="M882 150H1118M1000 32V268"/>
  </g>
  <g clip-path="url(#disc)">
    <g>
      <path d="M1000 150 L1118 150 A118 118 0 0 0 1076 59 Z" fill="url(#sweep)" transform="rotate(-18 1000 150)"/>
      <animateTransform attributeName="transform" type="rotate" from="0 1000 150" to="360 1000 150" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- tracks: three targets, each leaves a short trail -->
  <g fill="#fff">
    <circle cx="1050" cy="95" r="3.5"><animate attributeName="opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="955" cy="190" r="3.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1070" cy="195" r="3.5" fill="#E0122B"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#fff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M1032 107L1050 95"/><path d="M938 200L955 190"/><path d="M1052 205L1070 195" stroke="#E0122B" stroke-opacity="0.7"/>
  </g>
  <!-- text -->
  <text x="70" y="128" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="300" letter-spacing="1">Gurmaan Singh</text>
  <rect x="72" y="146" width="56" height="3" fill="#E0122B"/>
  <text x="70" y="188" fill="#ffffff" fill-opacity="0.82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Mechatronics engineering student</text>
  <text x="70" y="232" fill="#E0122B" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="2">SENSORS  /  CONTROL  /  EMBEDDED  /  AUTOMATION</text>
  <g fill="none" stroke="#E0122B" stroke-width="2"><path d="M20 50V20H50"/><path d="M1150 20H1180V50"/><path d="M20 250V280H50"/><path d="M1150 280H1180V250"/></g>
  <circle cx="76" cy="266" r="5" fill="#E0122B"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
  
<text x="92" y="271" fill="#fff" fill-opacity="0.85" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2" opacity="0">AVAILABLE FROM SUMMER 2027<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="8s" repeatCount="indefinite"/></text><text x="92" y="271" fill="#fff" fill-opacity="0.85" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2" opacity="0">OPEN TO ANY LOCATION<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.95;1" dur="8s" repeatCount="indefinite"/></text></svg>
