<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="vakt results: IMM against a single-model filter">
  <rect width="900" height="230" fill="#000" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="30" y="34" fill="#fff" fill-opacity="0.85" font-family="Segoe UI, Arial, sans-serif" font-size="15">Identity switches (lower is better)</text>
  <text x="30" y="64" fill="#fff" fill-opacity="0.7" font-family="Segoe UI, Arial, sans-serif" font-size="13">Single model</text>
  <rect x="140" y="48" width="0" height="20" fill="#6b6b6b"><animate attributeName="width" from="0" to="650" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
  <text x="800" y="64" fill="#fff" font-family="Consolas, monospace" font-size="14" opacity="0"><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/>271</text>
  <text x="30" y="94" fill="#fff" fill-opacity="0.7" font-family="Segoe UI, Arial, sans-serif" font-size="13">IMM</text>
  <rect x="140" y="78" width="0" height="20" fill="#E0122B"><animate attributeName="width" from="0" to="144" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
  <text x="294" y="94" fill="#fff" font-family="Consolas, monospace" font-size="14" opacity="0"><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/>60</text>
  <text x="30" y="130" fill="#fff" fill-opacity="0.85" font-family="Segoe UI, Arial, sans-serif" font-size="15">Mean GOSPA, metres (lower is better)</text>
  <text x="30" y="160" fill="#fff" fill-opacity="0.7" font-family="Segoe UI, Arial, sans-serif" font-size="13">Single model</text>
  <rect x="140" y="144" width="0" height="20" fill="#6b6b6b"><animate attributeName="width" from="0" to="576" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
  <text x="726" y="160" fill="#fff" font-family="Consolas, monospace" font-size="14" opacity="0"><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/>144 m</text>
  <text x="30" y="190" fill="#fff" fill-opacity="0.7" font-family="Segoe UI, Arial, sans-serif" font-size="13">IMM</text>
  <rect x="140" y="174" width="0" height="20" fill="#E0122B"><animate attributeName="width" from="0" to="496" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect>
  <text x="646" y="190" fill="#fff" font-family="Consolas, monospace" font-size="14" opacity="0"><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/>124 m</text>
  <text x="870" y="215" text-anchor="end" fill="#fff" fill-opacity="0.45" font-family="Segoe UI, Arial, sans-serif" font-size="11">vakt, manoeuvre scenario, 40 seeded Monte Carlo runs</text>
</svg>
